# Every input is pinned by URL, byte size and SHA-256. `nhs-ghg fetch` refuses
# a file whose hash differs, so a silent republication cannot change results.

reporting_period:
  label: "2025/26"
  start: "2025-04-01"
  end: "2026-03-31"
  # DESNZ "majority" approach: an April-March year uses the factors for the
  # calendar year holding most of the data (Apr-Dec 2025 -> 2025 factors).
  factor_year: 2025

sources:
  desnz_2025_flat:
    title: "UK Government GHG Conversion Factors for Company Reporting 2025 - flat file (v1, final)"
