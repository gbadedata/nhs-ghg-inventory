[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nhs-ghg-inventory"
version = "0.1.0"
description = "Scope 1-3 estate GHG inventory for every NHS trust in England, from ERIC 2025/26 and DESNZ 2025 factors"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Oluwagbade Odimayo"}]
dependencies = ["pandas>=2.0", "pyyaml>=6.0", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
nhs-ghg = "nhs_ghg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
